<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Academic Performance Prediction</title>
    <!-- Flask Static CSS Link -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h1>🎓 Student Academic Performance Prediction</h1>
            <p>Machine Learning Based Prediction System</p>
        </div>

        <div class="card-wrapper">
            <form action="/predict" method="POST" class="glass-card">
                
                <!-- Student Name -->
                <div class="input-field">
                    <span class="icon">👤</span>
                    <input type="text" name="student_name" placeholder="Student Name" required autocomplete="off">
                </div>

                <!-- Roll Number -->
                <div class="input-field">
                    <span class="icon">🪪</span>
                    <input type="text" name="roll_no" placeholder="Roll No / Enrollment No" required autocomplete="off">
                </div>

                <!-- Semester Dropdown -->
                <div class="input-field">
                    <span class="icon">📚</span>
                    <select name="semester" required>
                        <option value="" disabled selected>Select Semester</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                    </select>
                </div>

                <!-- Year Dropdown -->
                <div class="input-field">
                    <span class="icon">📅</span>
                    <select name="year" required>
                        <option value="" disabled selected>Select Year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>

                <!-- Study Hours -->
                <div class="input-field">
                    <span class="icon">📖</span>
                    <input type="number" step="0.1" name="study_hours" placeholder="Study Hours" required>
                </div>

                <!-- Attendance -->
                <div class="input-field">
                    <span class="icon">📈</span>
                    <input type="number" step="0.1" min="0" max="100" name="attendance" placeholder="Attendance (%)" required>
                </div>

                <!-- Predict Button -->
                <button type="submit" class="glow-btn">🚀 Predict Performance</button>

            </form>
        </div>

        <div class="footer">
            Developed with ❤️ by <span>Meraj Ansari</span>
        </div>
    </div>

</body>
</html>
